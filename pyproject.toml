[project]
name = "khuda-wordle"
version = "0.1.0"
description = "KHUDA AI Engineering 1주차 과제 - FastAPI Wordle"
authors = [
    { name = "odiowood", email = "deank7101@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
